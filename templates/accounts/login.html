{% extends "base.html" %}
{% block title %}Log in · NYC Event Explorer{% endblock %}
{% block content %}
<div class="panel">
  <h1>Log in</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "includes/form.html" %}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Log in</button>
  </form>
  <p><a href="{% url 'accounts:password_reset' %}">Forgot your password?</a></p>
  <p>New here? <a href="{% url 'accounts:signup' %}">Create an account</a></p>
</div>
{% endblock %}
