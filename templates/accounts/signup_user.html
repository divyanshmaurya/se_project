{% extends "base.html" %}
{% block title %}Sign up · NYC Event Explorer{% endblock %}
{% block content %}
<div class="panel">
  <h1>Create your account</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "includes/form.html" %}
    <button type="submit">Sign up</button>
  </form>
  <p>Hosting events? <a href="{% url 'accounts:signup_event_holder' %}">Create a business account</a></p>
</div>
{% endblock %}
